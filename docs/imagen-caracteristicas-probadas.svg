<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Características a ser probadas del sistema CASALIZ</title>
  <desc id="desc">Diagrama de módulos y características del sistema de gestión y seguimiento de proyectos y trámites.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#101828" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f5fbf"/>
      <stop offset="100%" stop-color="#f47b20"/>
    </linearGradient>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #475467; }
      .center-title { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #ffffff; }
      .center-subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #eef4ff; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
      .box-text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #475467; }
      .icon { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #ffffff; }
      .line { stroke: #98a2b3; stroke-width: 2; stroke-linecap: round; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #667085; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720"/>

  <g transform="translate(64 48)">
    <rect x="0" y="0" width="1072" height="92" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="0" y="0" width="12" height="92" rx="6" fill="url(#header)"/>
    <text class="title" x="34" y="38">Características a ser probadas</text>
    <text class="subtitle" x="34" y="68">Sistema CASALIZ: Gestión y seguimiento de proyectos, trámites, documentos e información institucional</text>
  </g>

  <g class="line">
    <line x1="600" y1="250" x2="260" y2="205"/>
    <line x1="600" y1="250" x2="600" y2="192"/>
    <line x1="600" y1="250" x2="940" y2="205"/>
    <line x1="600" y1="360" x2="260" y2="360"/>
    <line x1="600" y1="360" x2="940" y2="360"/>
    <line x1="600" y1="470" x2="260" y2="540"/>
    <line x1="600" y1="470" x2="600" y2="585"/>
    <line x1="600" y1="470" x2="940" y2="540"/>
  </g>

  <g transform="translate(438 236)" filter="url(#shadow)">
    <rect x="0" y="0" width="324" height="204" rx="18" fill="url(#header)"/>
    <text class="center-title" x="162" y="58" text-anchor="middle">Plan de pruebas</text>
    <text class="center-subtitle" x="162" y="92" text-anchor="middle">Validación funcional, seguridad,</text>
    <text class="center-subtitle" x="162" y="116" text-anchor="middle">datos, documentos, imágenes y reportes</text>
    <rect x="56" y="142" width="212" height="38" rx="19" fill="#ffffff" opacity="0.20"/>
    <text class="center-subtitle" x="162" y="166" text-anchor="middle">CASALIZ E.I.R.L.</text>
  </g>

  <g transform="translate(84 164)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="98" rx="10" fill="#ffffff"/>
    <circle cx="42" cy="49" r="24" fill="#1f5fbf"/>
    <text class="icon" x="42" y="58" text-anchor="middle">S</text>
    <text class="box-title" x="82" y="34">Seguridad</text>
    <text class="box-text" x="82" y="58">Acceso con credenciales,</text>
    <text class="box-text" x="82" y="78">sesiones y permisos por rol</text>
  </g>

  <g transform="translate(458 142)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="98" rx="10" fill="#ffffff"/>
    <circle cx="42" cy="49" r="24" fill="#16a34a"/>
    <text class="icon" x="42" y="58" text-anchor="middle">U</text>
    <text class="box-title" x="82" y="34">Usuarios</text>
    <text class="box-text" x="82" y="58">Registro, edición, consulta</text>
    <text class="box-text" x="82" y="78">y control de cuentas</text>
  </g>

  <g transform="translate(832 164)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="98" rx="10" fill="#ffffff"/>
    <circle cx="42" cy="49" r="24" fill="#f47b20"/>
    <text class="icon" x="42" y="58" text-anchor="middle">P</text>
    <text class="box-title" x="82" y="34">Proyectos</text>
    <text class="box-text" x="82" y="58">Creación, actualización,</text>
    <text class="box-text" x="82" y="78">consulta e imágenes asociadas</text>
  </g>

  <g transform="translate(84 311)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="98" rx="10" fill="#ffffff"/>
    <circle cx="42" cy="49" r="24" fill="#7c3aed"/>
    <text class="icon" x="42" y="58" text-anchor="middle">T</text>
    <text class="box-title" x="82" y="34">Trámites</text>
    <text class="box-text" x="82" y="58">Seguimiento por fases, tareas,</text>
    <text class="box-text" x="82" y="78">estados y responsables</text>
  </g>

  <g transform="translate(832 311)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="98" rx="10" fill="#ffffff"/>
    <circle cx="42" cy="49" r="24" fill="#0891b2"/>
    <text class="icon" x="42" y="58" text-anchor="middle">C</text>
    <text class="box-title" x="82" y="34">Consultas</text>
    <text class="box-text" x="82" y="58">Búsqueda pública del estado</text>
    <text class="box-text" x="82" y="78">mediante código de consulta</text>
  </g>

  <g transform="translate(84 501)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="98" rx="10" fill="#ffffff"/>
    <circle cx="42" cy="49" r="24" fill="#475467"/>
    <text class="icon" x="42" y="58" text-anchor="middle">D</text>
    <text class="box-title" x="82" y="34">Documentos</text>
    <text class="box-text" x="82" y="58">Carga, almacenamiento,</text>
    <text class="box-text" x="82" y="78">visualización y respaldo</text>
  </g>

  <g transform="translate(458 552)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="98" rx="10" fill="#ffffff"/>
    <circle cx="42" cy="49" r="24" fill="#db2777"/>
    <text class="icon" x="42" y="58" text-anchor="middle">R</text>
    <text class="box-title" x="82" y="34">Reportes</text>
    <text class="box-text" x="82" y="58">Generación, revisión</text>
    <text class="box-text" x="82" y="78">y visualización de resultados</text>
  </g>

  <g transform="translate(832 501)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="98" rx="10" fill="#ffffff"/>
    <circle cx="42" cy="49" r="24" fill="#0f766e"/>
    <text class="icon" x="42" y="58" text-anchor="middle">BD</text>
    <text class="box-title" x="82" y="34">Base de datos</text>
    <text class="box-text" x="82" y="58">Persistencia, recuperación,</text>
    <text class="box-text" x="82" y="78">integridad y disponibilidad</text>
  </g>

  <text class="small" x="600" y="690" text-anchor="middle">Imagen sugerida para colocar debajo de la descripción general de la sección 3 del plan de pruebas.</text>
</svg>
